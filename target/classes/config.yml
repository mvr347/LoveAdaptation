progression_blocking:
  enabled: true
  active_adaptation_blocks_others: true
  active_threshold_percent: 90.0
  blocking_indicator: "🔒"
  active_indicator: "✓"
  progressing_indicator: "⏳"
  mastery_indicator: "⭐"
  degrading_indicator: "📉"

degradation_system:
  enabled: true
  check_interval_seconds: 60
  reactivation_check_interval_seconds: 30
  deactivation_threshold_percent: 60.0

reactivation_priority:
  order:
    - NETHER
    - THE_END
    - CAVE
    - WATER
    - HEIGHT
    - COMBAT
    - TRAVEL

potions:
  adaptation_potion_i:
    enabled: true
    name: "&eЗелье адаптации I"
    duration_seconds: 60
    lore:
      - "&7Применяет эффекты всех 7 адаптаций"
      - "&7Длительность: &f60 секунд"
  adaptation_potion_ii:
    enabled: true
    name: "&eУсиленное зелье адаптации II"
    duration_seconds: 120
    lore:
      - "&7Применяет эффекты всех 7 адаптаций"
      - "&7Длительность: &f120 секунд"

tracking:
  check_interval_ticks: 1
  cave_check_interval_ticks: 100
  distance_tracking_threshold_blocks: 100.0

notifications:
  mastery_unlock:
    enabled: true
    title: "&6✨ Мастерство разблокировано"
    subtitle: "&f%adaptation_name%"
    sound: "ENTITY_PLAYER_LEVELUP"
    sound_volume: 1.0
    sound_pitch: 1.2
  adaptation_activated:
    enabled: true
    actionbar: "&aАдаптация активна: &f%adaptation_name%"
    sound: "BLOCK_RESPAWN_ANCHOR_CHARGE"
    sound_volume: 0.8
    sound_pitch: 1.0
  adaptation_degrading:
    enabled: true
    actionbar: "&c⚠ Адаптация деградирует: &f%adaptation_name% (%progress%)"
    sound: "ENTITY_GENERIC_HURT"
    sound_volume: 0.5
    sound_pitch: 0.8
  adaptation_deactivated:
    enabled: true
    actionbar: "&cАдаптация потеряна: &f%adaptation_name%"
    sound: "ENTITY_GENERIC_DEATH"
    sound_volume: 0.5
    sound_pitch: 0.5

gui:
  title: "&6Адаптации персонажа"
  size: 54
  tab_mutations_title: "&6Мутации персонажа"
  refresh_interval_ticks: 20

lang:
  prefix: "&8[&6LoveAdaptation&8] "
  no_permission: "&cУ вас нет прав для выполнения этой команды."
  only_players: "&cЭта команда доступна только игрокам."
  reloaded: "&aКонфигурация и база данных успешно перезагружены!"
  player_not_found: "&cИгрок %player% не найден."
  reset_success: "&aВсе адаптации игрока %player% сброшены."
  check_header: "&6=== Прогресс адаптаций %player% ==="
  check_item: "&7%adaptation_name%: &f%progress%% &7(%status%)"
  potion_applied: "&eВы выпили %potion_name%! Все адаптации активны на %duration% сек."
