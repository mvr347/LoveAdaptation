# Настройки нативного GUI-меню адаптаций (/loveadaptation menu). Раскладка
# (размер инвентаря, номера слотов) фиксирована в коде — здесь настраивается
# только текст служебных кнопок. Иконки и текст самих адаптаций берутся из
# config.yml (adaptations.<type>.*), текстуры служебных кнопок — из heads.yml.

menu:
  title: "&6Адаптации персонажа"

items:
  info:
    name: "&bИнформация"
    lore:
      - ""
      - "&7Адаптации развиваются от вашей активности."
      - "&7Наберите 90% для разблокировки бонусов мастерства!"

  close:
    name: "&cЗакрыть"
    lore:
      - ""
      - "&7ЛКМ - закрыть меню"

  player_head:
    lore:
      - ""
      - "&7Текущая: %color%%name%"
      - "&7Прогресс: &f%progress%"
