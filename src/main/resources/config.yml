# ==========================================
# LoveAdaptation v1.0.0 Configuration
# ==========================================

plugin:
  name: "LoveAdaptation"
  version: "1.0.0"

database:
  type: "sqlite"
  file: "plugins/LoveAdaptation/data.db"
  auto_backup: true
  backup_interval_hours: 6

base_adaptation:
  enabled: true
  name: "Базовая форма"
  color: "&7"
  head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTc5YzU1MWQyOGQzY2JjYjUzOTJkMTYyZTI5ZjJjODUzYzJkMTQzNzI3YzE3OWJlODZkNjlmNmY5YTEwNjUifX19"

adaptations:
  water:
    enabled: true
    name: "Дельфин"
    description: "Ускорение в воде и улучшенное дыхание"
    color: "&9"
    unlock_hours: 25
    required_ticks: 1800000  # 25 hours in water ticks
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjA3ZGJhMjZmMjliOGEzYjcxYzg1ODhjNzZkNDVmMDdkNmU3ZjQ4YjdiODA4YjUxZTJjNTk0OThhYjljMTQ0ZDYifX19"
    degradation_rate_percent_per_hour: 5.0
    effects_base:
      - type: "SPEED"
        level: 2
        apply_in: ["WATER"]
    # CONDUIT_POWER не даётся сразу при разблокировке (100% неуязвимость к утоплению
    # с 15 часов делала возможным бесконечно висеть в воде AFK) — теперь это награда
    # только за 90%+ мастерства.
    effects_bonus:
      - type: "SPEED"
        level: 3
        apply_in: ["WATER"]
      - type: "DOLPHINS_GRACE"
        level: 1
        apply_in: ["WATER"]
      - type: "CONDUIT_POWER"
        level: 1
        apply_in: ["WATER"]
    hunger_modifier_base: 1.0
    hunger_modifier_bonus: 0.9

  nether:
    enabled: true
    name: "Адепт огня"
    description: "Снижение урона от огня и лавы"
    color: "&c"
    unlock_hours: 20
    required_ticks: 1440000  # 20 hours in Nether ticks
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjEzYWZiNWJkM2NmNDNlZGRjNjQ1Y2MyNmNhMDNhM2E4MTgwZmJjNGExNGE2MTRlYmFkY2Q1NzFjYjliIn19fQ=="
    degradation_rate_percent_per_hour: 5.0
    effects_base:
      - type: "FIRE_RESISTANCE"
        level: 1
        apply_in: ["NETHER"]
    effects_bonus:
      - type: "FIRE_RESISTANCE"
        level: 2
        apply_in: ["NETHER"]
      - type: "RESISTANCE"
        level: 1
        apply_in: ["NETHER"]
    fire_damage_reduction_base: 0.4
    fire_damage_reduction_bonus: 0.5

  cave:
    enabled: true
    name: "Зрение во мраке"
    description: "Ночное видение в пещерах и подземелье"
    color: "&8"
    unlock_hours: 18
    required_ticks: 1296000  # 18 hours at Y < 32
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDEyNjQ5NDk5YjkzNzU3YTA1YmExODVkMmZjMDAxMzAwYzJiNWI2MjVhMDcyNTkxYzI0YzhlYjQ0ZmY2ODkifX19"
    degradation_rate_percent_per_hour: 5.0
    y_threshold: 32
    effects_base:
      - type: "NIGHT_VISION"
        level: 1
        apply_below_y: 32
    effects_bonus:
      - type: "NIGHT_VISION"
        level: 1
        apply_below_y: 32
      - type: "GLOWING"
        level: 1
        apply_below_y: 32

  height:
    enabled: true
    name: "Падальщик"
    description: "Снижение урона от падения"
    color: "&e"
    unlock_falls: 18
    required_events: 18
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDg5ZTRkOTY2N2RkOGU5ZTY0MjYxN2RhMGFjMWJkZGY1YTk3ZDE3NzIyYzBhMzk4MGMxMjhiNDVjMTkwNzAifX19"
    degradation_rate_percent_per_hour: 5.0
    fall_damage_reduction_base: 0.5
    fall_damage_reduction_bonus: 0.7
    effects_base: []
    effects_bonus:
      - type: "RESISTANCE"
        level: 1
        duration_ticks: 40
        trigger: "after_fall_damage"

  abyss:
    enabled: true
    name: "Страж Бездны"
    description: "Скрытность и защита в глубоких пещерах у бедрока, иммунитет к тьме"
    color: "&8"
    # Заменяет бывшую адаптацию Энда ("Скиталец Эндера"/"Повелитель Края") - тема сменена на
    # выживание в самых глубоких пещерах (ниже y_threshold, ближе к бедроку/Deep Dark), а не
    # на измерение Энда. unlock_hours поднят вместе с остальными адаптациями (было 8).
    unlock_hours: 15
    required_ticks: 1080000  # 15 hours below y_threshold
    y_threshold: -40
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2I5ODNlY2VhNTJlM2Y3ODNlNWYxY2Y2YWVkNWI0Yjc2NWVkZjhiNzc0ZDNlNTExM2EzNTAzYWIxYjY5YmEyIn19fQ=="
    degradation_rate_percent_per_hour: 5.0
    effects_base:
      - type: "NIGHT_VISION"
        level: 1
        apply_below_y: -40
    effects_bonus:
      - type: "NIGHT_VISION"
        level: 1
        apply_below_y: -40
      - type: "SPEED"
        level: 1
        apply_below_y: -40
    darkness_immunity: true  # рассеивает эффект Тьмы (Warden/Sculk Shrieker) на мастерстве 90%+

  combat:
    enabled: true
    name: "Боевой закал"
    description: "Слабая регенерация в перерывах между боями (не постоянная)"
    color: "&4"
    # 100 было слишком мало — набиралось за пару минут под ударами нескольких зомби,
    # тогда как другие адаптации требуют часы игры. Подняли до сопоставимого объёма,
    # затем ещё раз - вместе с общим увеличением времени прокачки всех адаптаций.
    unlock_damage: 9000.0
    required_damage: 9000.0
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMmE2ZDM2NjBiN2QxYmMzYTgyM2E4MTJhNjYwZDRmZGMzY2M5NzkxOTNjNDNlNmI5YWIyY2I3YzgxYjdmNzEifX19"
    degradation_rate_percent_per_hour: 2.0
    # Регенерация больше НЕ выдаётся за каждый полученный удар (раньше это делало её
    # фактически постоянной и слишком сильной в затяжном бою). Теперь, пока активна эта
    # адаптация, раз в check_interval_seconds она с шансом chance_* выдаёт слабую и короткую
    # регенерацию - но только если игрок min_seconds_since_damage не получал урона и его
    # уровень голода не ниже min_food_level (не голоден). См. AdaptationManager#processCombatPassiveRegen.
    passive_regen:
      enabled: true
      check_interval_seconds: 20
      min_seconds_since_damage: 60
      min_food_level: 18
      chance_base: 0.25
      chance_bonus: 0.4
      level_base: 0   # Regeneration I
      level_bonus: 1  # Regeneration II
      duration_ticks_base: 60   # 3 сек
      duration_ticks_bonus: 100 # 5 сек
    effects_base: []
    effects_bonus: []

  travel:
    enabled: true
    name: "Странник"
    description: "Снижение траты голода при ходьбе"
    color: "&6"
    unlock_km: 35.0
    required_distance_blocks: 35000.0  # 35km = 35,000 blocks
    max_progress_percent: 90.0
    bonus_threshold_percent: 90.0
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMmU2YTJmNjMxZTUwZTg1MzAwZTFjMjA3YTBjNjJiZDUxYjc5Nzc4OGQwMDkzMTIxY2VmNmQ1ZWNlYTI5ZTNkIn19fQ=="
    degradation_rate_percent_per_hour: 5.0
    hunger_modifier_base: 0.7
    hunger_modifier_bonus: 0.5
    effects_base: []
    effects_bonus:
      - type: "SPEED"
        level: 1
        apply_when_walking: true

progression_blocking:
  enabled: true
  active_adaptation_blocks_others: true
  active_threshold_percent: 90.0
  blocking_indicator: "🔒"
  active_indicator: "✓"
  progressing_indicator: "⏳"
  mastery_indicator: "⭐"
  degrading_indicator: "📉"

degradation_system:
  enabled: true
  check_interval_seconds: 60
  reactivation_check_interval_seconds: 30
  deactivation_threshold_percent: 60.0

reactivation_priority:
  order:
    - NETHER
    - ABYSS
    - CAVE
    - WATER
    - HEIGHT
    - COMBAT
    - TRAVEL

potions:
  adaptation_potion_i:
    enabled: true
    name: "&eЗелье адаптации I"
    duration_seconds: 60
    lore:
      - "&7Применяет эффекты всех 7 адаптаций"
      - "&7Длительность: &f60 секунд"
  adaptation_potion_ii:
    enabled: true
    name: "&eУсиленное зелье адаптации II"
    duration_seconds: 120
    lore:
      - "&7Применяет эффекты всех 7 адаптаций"
      - "&7Длительность: &f120 секунд"

tracking:
  check_interval_ticks: 1
  cave_check_interval_ticks: 100
  distance_tracking_threshold_blocks: 100.0

notifications:
  mastery_unlock:
    enabled: true
    title: "&6✨ Мастерство разблокировано"
    subtitle: "&f%adaptation_name%"
    sound: "ENTITY_PLAYER_LEVELUP"
    sound_volume: 1.0
    sound_pitch: 1.2
  adaptation_activated:
    enabled: true
    actionbar: "&aАдаптация активна: &f%adaptation_name%"
    sound: "BLOCK_RESPAWN_ANCHOR_CHARGE"
    sound_volume: 0.8
    sound_pitch: 1.0
  adaptation_degrading:
    enabled: true
    actionbar: "&c⚠ Адаптация деградирует: &f%adaptation_name% (%progress%)"
    sound: "ENTITY_GENERIC_HURT"
    sound_volume: 0.5
    sound_pitch: 0.8
  adaptation_deactivated:
    enabled: true
    actionbar: "&cАдаптация потеряна: &f%adaptation_name%"
    sound: "ENTITY_GENERIC_DEATH"
    sound_volume: 0.5
    sound_pitch: 0.5

