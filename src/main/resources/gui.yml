# Настройки нативного GUI-меню адаптаций (/loveadaptation menu). Иконки и текст
# самих адаптаций берутся из config.yml (adaptations.<type>.*) — их набор и
# порядок в меню не настраивается тут, только материал/текстура/текст уже
# существующих служебных кнопок (Info/Back/Close) и полностью новые кнопки
# сверх них (items.custom_buttons).
#
# Раскладка (размер инвентаря 54, слоты головы/адаптаций/Close) фиксирована в
# коде — стандарт gui_gen v2.1 требует этого для головы (слот 0) и Close
# (слот 53, всегда присутствует, никогда не выключается и не двигается).
#
# Добавлено 2026-09-23 по запросу владельца ("довести GUI до той же степени
# настраиваемости, что и у LoveBehaivor — снимать/добавлять базовые кнопки,
# двигать их, добавлять свои со своими текстурами и командами"):
# - items.info.enabled / items.back.enabled — можно выключить кнопку, слот
#   тогда остаётся стеклом (RULE 2 п.5 gui_gen v2.1 — динамическая кнопка без
#   функции не оставляет пустоту).
# - items.back.command — переопределяет gui.mainmenu_back_command из
#   config.yml, если задан непустым (напр. "dmenu open hub" — целевая команда
#   открытия хаб-меню DeluxeMenus, без ведущего "/"). Старый ключ по-прежнему
#   работает без изменений, если это поле не задано.
# - items.custom_buttons — список полностью новых кнопок сверх встроенных.
#   Каждая запись обязана иметь непустые slot и command; slot обязан попасть в
#   зону, разрешённую стандартом gui_gen v2.1 для кнопок в этом меню (зона
#   управления Header 2-7, рабочая зона кроме боковых стенок 18/26/27/35/36/44
#   и уже занятых слотов адаптаций 19-25, footer-позиции 6/7 — не Row1 9-17,
#   не слот Close 53). Некорректная или занятая другим элементом запись
#   пропускается с предупреждением в лог, а не ломает остальное меню.
#
# material vs texture_base64 (info/back/close и custom_buttons): texture_base64
# — "сырой" base64 текстуры головы (формат HeadDatabase). material — либо
# обычное имя Material (напр. NETHER_STAR) для предмета без головы, либо
# "basehead-<base64>" (тот же base64, что и в texture_base64) — этот синтаксис
# специально совпадает с материалом "basehead-<base64>" стандарта gui_gen v2.1,
# чтобы конфиг был переносим между меню/плагинами экосистемы. Если задано
# texture_base64 — используется оно, material игнорируется (обратная
# совместимость со старыми gui.yml, где material не было вовсе).

menu:
  title: "&6Адаптации персонажа"
  # Материал стекла-рамки Header/Footer (RULE 2 gui_gen v2.1). Добавлено 2026-09-23.
  filler_material: "GRAY_STAINED_GLASS_PANE"

items:
  notifications:
    # Добавлено 2026-09-25: кнопка управления меню (Вк, gui_gen v2.1 RULE 4 — единственная
    # Вк этого меню, центрируется на слоте 4 диапазона 2-7). Переключает per-player
    # уведомления адаптаций (title/actionbar/sound из notifications.* в config.yml) без
    # выхода из меню. enabled=false убирает кнопку - слот остаётся стеклом (RULE 2 п.5).
    enabled: true
    # material / texture_base64 переопределяют иконку (по умолчанию BELL/GRAY_DYE в коде
    # в зависимости от текущего состояния игрока), если заданы непустыми.
    # material: ""
    # texture_base64: ""
    # name / lore не заданы — код сам подставляет текст под текущее состояние
    # (ВКЛ/ВЫКЛ), чтобы кнопка не показывала неверное состояние другому игроку.

  info:
    # enabled добавлено 2026-09-23. Позиция (footer-слот 51, локальная позиция
    # "Д") фиксирована стандартом — не настраивается.
    enabled: true
    # material / texture_base64 переопределяют текстуру из heads.yml (ключ info),
    # если заданы непустыми — добавлено 2026-09-23.
    # material: ""
    # texture_base64: ""
    name: "&bИнформация"
    lore:
      - ""
      - "&7Адаптации развиваются от вашей активности."
      - "&7Наберите 90% для разблокировки бонусов мастерства!"

  close:
    # material / texture_base64 переопределяют текстуру из heads.yml (ключ
    # close), если заданы непустыми — добавлено 2026-09-23.
    # material: ""
    # texture_base64: ""
    name: "&cЗакрыть"
    lore:
      - ""
      - "&7ЛКМ - закрыть меню"

  back:
    # enabled добавлено 2026-09-23 — можно принудительно выключить Назад, даже
    # если gui.mainmenu_back_command в config.yml задан.
    enabled: true
    # command: "" # добавлено 2026-09-23 — переопределяет gui.mainmenu_back_command
    # из config.yml, если задано непустым.
    # material / texture_base64 переопределяют текстуру из heads.yml (ключ back),
    # если заданы непустыми — добавлено 2026-09-23.
    # material: ""
    # texture_base64: ""
    name: "&7Назад"
    lore:
      - ""
      - "&7ЛКМ - вернуться назад"

  player_head:
    lore:
      - ""
      - "&7Текущая: %color%%name%"
      - "&7Прогресс: &f%progress%"

  # Список полностью новых кнопок сверх встроенных (Info/Back/Close выше) —
  # добавлено 2026-09-23. Пример (закомментирован):
  # custom_buttons:
  #   - slot: 30
  #     enabled: true
  #     material: "NETHER_STAR"
  #     name: "&dПример кнопки"
  #     lore: ["&7Нажмите, чтобы выполнить команду"]
  #     command: "someplugin somecommand"
  custom_buttons: []
