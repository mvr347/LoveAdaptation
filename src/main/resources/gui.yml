  # Кнопка "Закрыть" (слот 53 в Footer, позиция 8)
  close:
    enabled: true
    slot: 53
    mainmenu: both
    command: ""
    material: "PLAYER_HEAD"
    texture_base64: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2VkMWFiYTczZjYzOWY0YmM0MmJkNDgxOTZjNzE1MTk3YmUyNzEyYzNiOTYyYzk3ZWJmOWU5ZWQ4ZWZhMDI1In19fQ=="
