# ==============================================================================
#                      LoveAdaptation — Меню Адаптаций
# ==============================================================================
#
# Раскладка меню (размер 54 слота):
#  - Header (слоты 0-8):
#      Слот 0: Голова игрока (player_head)
#      Слоты 1-3, 5-8: Стекло (GRAY_STAINED_GLASS_PANE)
#      Слот 4: Кнопка управления (Вк) — переключение уведомлений (notifications)
#  - Row1 (слоты 9-17):
#      Всегда 100% стекло (RULE 5)
#  - Рабочая зона (слоты 18-44):
#      Боковые стенки 18, 26, 27, 35, 36, 44 — строго ПУСТО (AIR, никакого стекла!)
#      Слоты 19-25: Иконки 7 адаптаций (Дельфин, Адепт огня, Зрение во мраке,
#                   Падальщик, Страж Бездны, Боевой закал, Странник)
#      Слоты 28-34, 37-43: Свободная рабочая зона (для custom_buttons)
#  - Footer (слоты 45-53):
#      Слоты 45-50: Стекло (GRAY_STAINED_GLASS_PANE)
#      Слот 51: Информация (info, позиция 6 / "Д")
#      Слот 52: Назад (back, позиция 7 / Back) — активно в режиме mainmenu
#      Слот 53: Закрыть (close, позиция 8 / Close)
#
# Параметры кнопок:
#  - enabled: true/false — включена ли кнопка (при false слот заполняется стеклом)
#  - slot: 0-53 — целевой слот в инвентаре
#  - mainmenu: both / true / false — режим отображения:
#      both: во всех режимах (и /adaptation menu, и /adaptation mainmenu)
#      true: только в режиме mainmenu (/adaptation mainmenu — из хаб-меню сервера)
#      false: только в обычном режиме (/adaptation menu)
#  - command: команда игрока без ведущего "/" (напр. "dm open hub")
#  - material: Material или PLAYER_HEAD
#  - texture_base64: Base64-текстура кастомной головы (HeadDatabase / minecraft-heads)
# ==============================================================================

menu:
  title: "&6Адаптации персонажа"
  filler_material: "GRAY_STAINED_GLASS_PANE"
  # Включает режим mainmenu (открытие с кнопкой 'Назад' через /loveadaptation mainmenu)
  mainmenu: true

items:
  # Голова игрока (слот 0 в Header)
  player_head:
    enabled: true
    slot: 0
    mainmenu: both
    material: "PLAYER_HEAD"
    name: "&f%player%"
    lore:
      - ""
      - "&7Текущая: %color%%name%"
      - "&7Прогресс: &f%progress%"

  # Кнопка управления (Вк) — переключение уведомлений (слот 4 в Header)
  notifications:
    enabled: true
    slot: 4
    mainmenu: both
    material: "PLAYER_HEAD"
    texture_base64: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTI2MDZiY2M4MDY3MTZjZWI4YjM0NmE2ZmQ4NTI3ZWEzZjQ0ODkyYWUwZGM2MjMxMTk0YWQ3NzU3MmZkNTQ3MCJ9fX0="
    name: "&eУведомления: %state%"
    lore:
      - ""
      - "&7Статус: %state%"
      - ""
      - "&7Титры, сообщения и звуки"
      - "&7о прогрессе и деградации адаптаций."
      - ""
      - "&eЛКМ &7— переключить"

  # Кнопка информации (слот 51 в Footer, позиция "Д")
  info:
    enabled: true
    slot: 51
    mainmenu: both
    command: ""
    material: "PLAYER_HEAD"
    texture_base64: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDMyMmE1NzY1NDA2YWU0YTg0YzFlMGZiYjkxODMzN2JmMzU0ZWM3ZWJkODllNDE3MzI1MzljZjhkZTQ1OTA5ZiJ9fX0="
    name: "&bИнформация"
    lore:
      - ""
      - "&7Адаптации развиваются от вашей активности."
      - "&7Наберите 90% для разблокировки бонусов мастерства!"

  # Кнопка "Назад" (слот 52 в Footer, позиция 7) — отображается при открытии через /adaptation mainmenu
  back:
    enabled: true
    slot: 52
    mainmenu: true
    command: ""
    material: "PLAYER_HEAD"
    texture_base64: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ=="
    name: "&7Назад"
    lore:
